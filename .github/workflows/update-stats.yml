name: Update DSA Statistics

on:
  push:
    paths:
      - 'Java/**/*.java'
      - 'Java/*.java'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate statistics
        run: |
          TOTAL=$(find Java -name "*.java" | wc -l)
          EASY=$(grep -rilE '^//[[:space:]]*Easy[[:space:]]*$' Java --include="*.java" | wc -l)
          MEDIUM=$(grep -rilE '^//[[:space:]]*Medium[[:space:]]*$' Java --include="*.java" | wc -l)
          HARD=$(grep -rilE '^//[[:space:]]*Hard[[:space:]]*$' Java --include="*.java" | wc -l)

          python - <<EOF
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text()

          text = re.sub(
              r'<!-- PROBLEM_COUNT_START -->.*?<!-- PROBLEM_COUNT_END -->',
              f'<!-- PROBLEM_COUNT_START -->{TOTAL}<!-- PROBLEM_COUNT_END -->',
              text
          )

          text = re.sub(
              r'<!-- EASY_COUNT_START -->.*?<!-- EASY_COUNT_END -->',
              f'<!-- EASY_COUNT_START -->{EASY}<!-- EASY_COUNT_END -->',
              text
          )

          text = re.sub(
              r'<!-- MEDIUM_COUNT_START -->.*?<!-- MEDIUM_COUNT_END -->',
              f'<!-- MEDIUM_COUNT_START -->{MEDIUM}<!-- MEDIUM_COUNT_END -->',
              text
          )

          text = re.sub(
              r'<!-- HARD_COUNT_START -->.*?<!-- HARD_COUNT_END -->',
              f'<!-- HARD_COUNT_START -->{HARD}<!-- HARD_COUNT_END -->',
              text
          )

          path.write_text(text)
          EOF

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "Update DSA statistics"
            git push
          fi
